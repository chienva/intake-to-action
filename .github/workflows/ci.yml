name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.11
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, json, mbstring, openssl, pcre, pdo, pdo_sqlite, session, tokenizer, xml
          coverage: none
      - run: php scripts/lab-preflight.php
      - run: cp .env.example .env
      - run: php scripts/lab-preflight.php
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate
      - run: composer check-platform-reqs
      - name: Refuse audit and policy overrides
        run: jq -e '(.config | has("audit") or has("policy")) | not' composer.json
      - run: ./vendor/bin/pint --test
      - run: php artisan test
      - run: composer audit --abandoned=fail
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash scripts/ci-secrets.sh
